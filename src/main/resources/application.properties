spring.application.name=campusly

# Server
server.port=8081

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/campusly
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool (HikariCP defaults are fine; override if needed)
spring.datasource.hikari.maximum-pool-size=10

# Static file upload folder (absolute or relative)
campusly.uploads.path=uploads

# JWT (simple config)
jwt.secret=
jwt.expiration-ms=3600000

# Logging
logging.level.org.springframework=INFO
logging.level.com.campusly=DEBUG

razorpay.key-id=
razorpay.key-secret=FA4tC6ebv8gH9QOWnumu8rSh
razorpay.currency=INR


# Gmail SMTP Configuration
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
