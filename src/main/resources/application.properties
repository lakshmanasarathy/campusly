spring.application.name=campusly

# Server
server.port=8081

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/campusly
spring.datasource.username=username
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection pool
spring.datasource.hikari.maximum-pool-size=10

# Static file upload folder
campusly.uploads.path=uploads

# JWT
jwt.secret=secret-key
jwt.expiration-ms=3600000

# Logging
logging.level.org.springframework=INFO
logging.level.com.project.lms=DEBUG

spring.web.resources.static-locations=classpath:/frontend/
