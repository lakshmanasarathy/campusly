<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Campusly</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            Campusly
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Login to your Campusly account
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-full">

                Login

            </button>

        </form>

        <div id="loginMessage"></div>

        <p class="switch-auth">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
